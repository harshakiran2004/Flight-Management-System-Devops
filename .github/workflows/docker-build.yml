name: Docker Build and Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Build and Test Flight Management System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t flight-backend-ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t flight-frontend-ci .

      - name: Create Docker network
        run: docker network create ci-network

      - name: Start MongoDB
        run: |
          docker run -d \
            --name ci-mongodb \
            --network ci-network \
            --network-alias mongodb \
            mongo:7

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if docker exec ci-mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; then
              echo "MongoDB is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB failed to start"
          docker logs ci-mongodb
          exit 1

      - name: Start backend
        run: |
          docker run -d \
            --name ci-backend \
            --network ci-network \
            -p 5000:5000 \
            -e MONGO_URI=mongodb://mongodb:27017/flight_booking_system \
            -e MONGO_DB_NAME=flight_booking_system \
            -e JWT_SECRET=ci-test-secret-only \
            -e API_PORT=5000 \
            -e PORT=5000 \
            -e CLIENT_URL=http://localhost:3000 \
            flight-backend-ci

      - name: Test backend health API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5000/api/health; then
              echo ""
              echo "Backend health test passed"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health test failed"
          docker logs ci-backend
          exit 1

      - name: Clean up test containers
        if: always()
        run: |
          docker rm -f ci-backend ci-mongodb 2>/dev/null || true
          docker network rm ci-network 2>/dev/null || true