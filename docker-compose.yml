services:
  mongodb:
    image: mongo:7
    container_name: flight-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
     test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
     interval: 10s
     timeout: 15s
     retries: 10
     start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flight-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      PORT: "5000"
      API_PORT: "5000"
      MONGO_URI: "mongodb://mongodb:27017/flight_booking_system"
      MONGO_DB_NAME: "flight_booking_system"
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: "http://localhost:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: flight-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data: